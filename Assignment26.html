<!DOCTYPE html>
<html>
<head>
    <title>Box Model Annotated</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .box {
            width: 250px;
            background-color: lightblue;
            padding: 30px;
            border: 10px solid blue;
            margin: 40px auto;
            text-align: center;
        }

        .content {
            background-color: lightyellow;
            padding: 20px;
        }

    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">

        <div class="content">
            <h2>Content</h2>
            <p>This is the content area.</p>
        </div>

    </div>

    <h2>Box Model Properties</h2>

    <ul>
        <li>Content: Actual text or image.</li>
        <li>Padding: Space inside the border.</li>
        <li>Border: Line around the padding.</li>
        <li>Margin: Space outside the border.</li>
    </ul>

</body>
</html>
