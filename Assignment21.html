<!DOCTYPE html>
<html>
<head>
    <title>Lightly Styled Page</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        p {
            color: black;
            font-size: 18px;
        }

        h2 {
            color: darkgreen;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>

</head>
<body>

    <h1>Welcome to My Website</h1>

    <h2>About Me</h2>

    <p>
        Hello! I am a student learning HTML and CSS.
        I enjoy creating simple web pages.
    </p>

    <h2>My Skills</h2>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <button>Learn More</button>

</body>
</html>
