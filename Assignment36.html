<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .gallery img:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/400/300" alt="Mountain view">

        <img src="https://picsum.photos/id/1016/400/300" alt="Nature view">

        <img src="https://picsum.photos/id/1025/400/300" alt="Dog">

        <img src="https://picsum.photos/id/1035/400/300" alt="Forest">

        <img src="https://picsum.photos/id/1043/400/300" alt="Beach">

        <img src="https://picsum.photos/id/1050/400/300" alt="Landscape">

    </div>

</body>
</html>
