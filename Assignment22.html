<!DOCTYPE html>
<html>
<head>
    <title>CSS Selector Types</title>

    <style>

        /* Element Selector */
        h1 {
            color: blue;
        }

        /* ID Selector */
        #heading {
            color: red;
        }

        /* Class Selector */
        .para {
            color: green;
            font-size: 18px;
        }

        /* Universal Selector */
        * {
            font-family: Arial;
        }

        /* Group Selector */
        h2, h3 {
            color: purple;
        }

    </style>
</head>

<body>

    <h1>Element Selector</h1>

    <h1 id="heading">ID Selector</h1>

    <p class="para">This is Class Selector.</p>

    <h2>Group Selector</h2>

    <h3>Another Group Selector</h3>

    <p>This is a normal paragraph.</p>

</body>
</html>
