<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Wrap Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .product {
            background-color: white;
            width: 200px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .product h3 {
            color: #333;
        }

        .price {
            color: green;
            font-weight: bold;
            font-size: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="container">

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Shoes">
            <h3>Shoes</h3>
            <p class="price">₹1,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Bag">
            <h3>Travel Bag</h3>
            <p class="price">₹799</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
