<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>

    <form>

        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your full name">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email">
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone" placeholder="Enter phone number">
        <br><br>

        <label>Address:</label>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <label>Position Applied For:</label>
        <select name="position">
            <option>Select Position</option>
            <option>Web Developer</option>
            <option>Software Developer</option>
            <option>Data Analyst</option>
            <option>UI Designer</option>
        </select>
        <br><br>

        <label>Qualification:</label>
        <input type="text" name="qualification" placeholder="Enter qualification">
        <br><br>

        <label>Experience:</label>
        <input type="number" name="experience" placeholder="Years of experience">
        <br><br>

        <label>Upload Resume:</label>
        <input type="file" name="resume">
        <br><br>

        <label>Cover Letter:</label>
        <textarea name="coverletter" rows="5" cols="30"
        placeholder="Write about yourself"></textarea>
        <br><br>

        <input type="checkbox" name="terms">
        I agree to the terms and conditions.
        <br><br>

        <input type="submit" value="Apply Now">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
