<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Header Sidebar Products</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 1fr;
            grid-template-areas:
                "header header"
                "sidebar products";
            min-height: 100vh;
        }

        .header {
            grid-area: header;
            background-color: #333;
            color: white;
            padding: 20px;
            font-size: 24px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #444;
            color: white;
            padding: 20px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            margin: 20px 0;
        }

        .products {
            grid-area: products;
            padding: 20px;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .product {
            background-color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .product h3 {
            color: #333;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
                grid-template-areas:
                    "header"
                    "sidebar"
                    "products";
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">
            My Shopping Website
        </header>

        <aside class="sidebar">
            <h2>Categories</h2>

            <ul>
                <li>Electronics</li>
                <li>Clothing</li>
                <li>Shoes</li>
                <li>Accessories</li>
            </ul>
        </aside>

        <main class="products">

            <h1>Our Products</h1>

            <div class="product-container">

                <div class="product">
                    <img src="https://picsum.photos/300/200?1" alt="Headphones">
                    <h3>Headphones</h3>
                    <p class="price">₹999</p>
                    <button>Buy Now</button>
                </div>

                <div class="product">
                    <img src="https://picsum.photos/300/200?2" alt="Smart Watch">
                    <h3>Smart Watch</h3>
                    <p class="price">₹1,499</p>
                    <button>Buy Now</button>
                </div>

                <div class="product">
                    <img src="https://picsum.photos/300/200?3" alt="Shoes">
                    <h3>Shoes</h3>
                    <p class="price">₹1,999</p>
                    <button>Buy Now</button>
                </div>

                <div class="product">
                    <img src="https://picsum.photos/300/200?4" alt="Travel Bag">
                    <h3>Travel Bag</h3>
                    <p class="price">₹799</p>
                    <button>Buy Now</button>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
