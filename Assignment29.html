<!DOCTYPE html>
<html>
<head>
    <title>Hero Position Z-Index</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            position: relative;
            height: 400px;
            background-color: lightblue;
            text-align: center;
            padding-top: 50px;
        }

        .box1 {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 200px;
            height: 150px;
            background-color: blue;
            color: white;
            z-index: 1;
        }

        .box2 {
            position: absolute;
            top: 150px;
            left: 180px;
            width: 200px;
            height: 150px;
            background-color: orange;
            color: black;
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 3;
            padding-top: 30px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <div class="hero">

        <div class="box1">
            <h2>Box 1</h2>
        </div>

        <div class="box2">
            <h2>Box 2</h2>
        </div>

        <div class="content">
            <h1>Welcome to My Website</h1>
            <p>This is a Hero Section.</p>
            <button>Explore More</button>
        </div>

    </div>

</body>
</html>
