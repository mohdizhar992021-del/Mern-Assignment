<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Navbar Hero</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 15px 30px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .menu a {
            color: white;
            text-decoration: none;
        }

        .menu a:hover {
            color: orange;
        }

        /* Hero Section */
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            height: 400px;
            background-color: #e3f2fd;
            padding: 20px;
        }

        .hero h1 {
            font-size: 40px;
            color: #333;
        }

        .hero p {
            font-size: 18px;
            color: #555;
        }

        .hero button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .hero button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">My Website</div>

        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Welcome to My Website</h1>

        <p>Learn and explore new things with us.</p>

        <button>Get Started</button>
    </section>

</body>
</html>
