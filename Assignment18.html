<!DOCTYPE html>
<html>
<head>
    <title>Size Chart Table</title>
</head>
<body>

    <h1>Clothing Size Chart</h1>

    <table border="1">

        <tr>
            <th>Size</th>
            <th>Chest (inches)</th>
            <th>Waist (inches)</th>
            <th>Length (inches)</th>
        </tr>

        <tr>
            <td>Small (S)</td>
            <td>36</td>
            <td>30</td>
            <td>26</td>
        </tr>

        <tr>
            <td>Medium (M)</td>
            <td>38</td>
            <td>32</td>
            <td>27</td>
        </tr>

        <tr>
            <td>Large (L)</td>
            <td>40</td>
            <td>34</td>
            <td>28</td>
        </tr>

        <tr>
            <td>Extra Large (XL)</td>
            <td>42</td>
            <td>36</td>
            <td>29</td>
        </tr>

    </table>

</body>
</html>
